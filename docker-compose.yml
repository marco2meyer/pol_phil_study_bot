services:
  app:
    build: .
    container_name: polphil_app
    env_file:
      - .env
    ports:
      - "8501:8501"
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    container_name: polphil_mongo
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    ports:
      # Expose for remote/local access; protect via firewall
      - "27017:27017"
    restart: unless-stopped

volumes:
  mongo_data:
